    <!-- Desktop Layer
         Os nove ícones dividem a mesma construção: uma pastilha de
         20x20 na grade de 24, marca em stroke 1.75 e uma cor do tema
         por app. É o que os faz parecer do mesmo sistema em vez de
         nove ícones avulsos de biblioteca. -->
    <div id="desktop">
        <div class="desktop-icons">
            <div class="desktop-icon" data-app="terminal" data-accent="green">
                <div class="icon-image">
                    <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor"
                        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <rect class="icon-chip" x="2" y="2" width="20" height="20" rx="5.5" />
                        <path d="M7.5 9.25 10.25 12 7.5 14.75" />
                        <path d="M12.75 15.25h4" />
                    </svg>
                </div>
                <span class="icon-label" data-i18n="desktop.terminal">Terminal</span>
            </div>
            <div class="desktop-icon" data-app="themes" data-accent="magenta">
                <div class="icon-image">
                    <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor"
                        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <rect class="icon-chip" x="2" y="2" width="20" height="20" rx="5.5" />
                        <rect x="6.25" y="6.25" width="5" height="5" rx="1.2" fill="var(--green)" stroke="none" />
                        <rect x="12.75" y="6.25" width="5" height="5" rx="1.2" fill="var(--cyan)" stroke="none" />
                        <rect x="6.25" y="12.75" width="5" height="5" rx="1.2" fill="var(--yellow)" stroke="none" />
                        <rect x="12.75" y="12.75" width="5" height="5" rx="1.2" fill="var(--magenta)" stroke="none" />
                    </svg>
                </div>
                <span class="icon-label" data-i18n="desktop.themes">Themes</span>
            </div>
            <div class="desktop-icon" data-app="player" data-accent="cyan">
                <div class="icon-image">
                    <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor"
                        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <rect class="icon-chip" x="2" y="2" width="20" height="20" rx="5.5" />
                        <path d="M9.75 7.75 17 12l-7.25 4.25z" fill="currentColor" fill-opacity="0.2" />

                </div>
                <span class="icon-label" data-i18n="desktop.ascii_player">ASCII Player</span>

                        <rect class="icon-chip" x="2" y="2" width="20" height="20" rx="5.5" />
                        <path d="M10.5 15.5V7.25l6.25-1.15v8.15" />
                        <circle cx="8.6" cy="15.6" r="1.9" fill="currentColor" fill-opacity="0.22" />
                        <circle cx="14.85" cy="14.35" r="1.9" fill="currentColor" fill-opacity="0.22" />
                    </svg>
                </div>
                <span class="icon-label" data-i18n="desktop.music">Music</span>
            </div>
            <div class="desktop-icon" data-app="games" data-accent="green">

                </div>
                <span class="icon-label" data-i18n="desktop.games">Games</span>
            </div>
            <div class="desktop-icon" data-app="projetos" data-accent="cyan">

                    <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor"

                        <rect class="icon-chip" x="2" y="2" width="20" height="20" rx="5.5" />

                        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <rect class="icon-chip" x="2" y="2" width="20" height="20" rx="5.5" />

                    </svg>
                </div>
                <span class="icon-label" data-i18n="desktop.mirror">ASCII Mirror</span>
            </div>
            <div class="desktop-icon" data-app="monitor" data-accent="cyan">

                        <rect class="icon-chip" x="2" y="2" width="20" height="20" rx="5.5" />
                        <path d="M7 8.25h10" />
                        <circle cx="8" cy="12.25" r="1.05" fill="currentColor" stroke="none" />
                        <circle cx="12" cy="12.25" r="1.05" fill="currentColor" stroke="none" />
                        <circle cx="16" cy="12.25" r="1.05" fill="currentColor" stroke="none" />
                        <circle cx="8" cy="16.25" r="1.05" fill="currentColor" stroke="none" />
                        <circle cx="12" cy="16.25" r="1.05" fill="currentColor" stroke="none" />
                        <circle cx="16" cy="16.25" r="1.05" fill="var(--green)" stroke="none" />
                    </svg>
                </div>
                <span class="icon-label" data-i18n="desktop.calculadora">Calculadora</span>
            </div>
        </div>
    </div>

    <!-- App Windows Container (includes terminal) -->
    <div id="app-windows">
        <div id="terminal">
            <!-- Resize Handles -->
            <div class="resize-handle resize-handle-n" data-resize="n"></div>
            <div class="resize-handle resize-handle-s" data-resize="s"></div>
            <div class="resize-handle resize-handle-e" data-resize="e"></div>
            <div class="resize-handle resize-handle-w" data-resize="w"></div>
            <div class="resize-handle resize-handle-ne" data-resize="ne"></div>
            <div class="resize-handle resize-handle-nw" data-resize="nw"></div>
            <div class="resize-handle resize-handle-se" data-resize="se"></div>
            <div class="resize-handle resize-handle-sw" data-resize="sw"></div>

            <div id="terminal-header">
                <div class="buttons">
                    <div class="button red" data-action="close" title="Close" role="button" tabindex="0" aria-label="Close terminal"></div>
                    <div class="button yellow" data-action="minimize" title="Minimize" role="button" tabindex="0" aria-label="Minimize terminal"></div>
                    <div class="button green" data-action="maximize" title="Maximize" role="button" tabindex="0" aria-label="Maximize terminal"></div>
                </div>
                <div class="terminal-title">gabriel_lopes@portfolio: ~</div>
            </div>
            <div id="terminal-body" onclick="document.getElementById('command-input').focus()">
                <div id="output"></div>
                <div class="prompt-line">
                    <span class="prompt">$&gt;</span>
                    <div class="input-container">
                        <span id="input-mirror" class="input-mirror" aria-hidden="true"></span>
                        <span id="cursor" class="cursor"></span>
                        <input type="text" id="command-input" autocomplete="off" autofocus>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <div id="taskbar-start" title="Focus Terminal">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
            <span>Terminal</span>
        </div>
        <div id="taskbar-divider"></div>
        <div id="taskbar-windows"></div>
        <div id="taskbar-tray">
            <div class="tray-icon" id="taskbar-crt" title="Toggle CRT Effect">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
            </div>
            <div class="tray-icon" id="taskbar-sound" role="button" tabindex="0"
                 title="Som da interface" aria-pressed="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 5 6 9H3v6h3l5 4z" />
                    <path class="sound-on" d="M15.5 8.5a5 5 0 0 1 0 7" />
                    <path class="sound-on" d="M18.5 5.5a9 9 0 0 1 0 13" />
                    <path class="sound-off" d="m16.5 9.5 5 5" />
                    <path class="sound-off" d="m21.5 9.5-5 5" />
                </svg>
            </div>
            <div class="tray-divider"></div>
            <div id="taskbar-clock">
                <span id="clock-time"></span>
                <span id="clock-date"></span>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
